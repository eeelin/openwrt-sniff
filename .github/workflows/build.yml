name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.9'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test ./cmd/... ./internal/... ./web
      - run: go vet ./cmd/... ./internal/... ./web
      - run: sh -n package/openwrt-sniff/files/etc/init.d/sniffd
      - run: bash -n build.sh
      - run: sh -n install.sh
      - run: bash tests/test_install.sh

  prepare-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('.github/openwrt-sdk-matrix.json') as f:
              print('matrix=' + json.dumps(json.load(f), separators=(',', ':')))
          PY

  package:
    needs: [test, prepare-matrix]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.9'
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y build-essential gawk libncurses-dev file rsync unzip wget zlib1g-dev python3-pyelftools zstd
      - uses: actions/cache@v4
        with:
          path: .work/downloads
          key: openwrt-sdk-${{ matrix.name }}
      - name: Build OpenWrt package
        env:
          SDK_URL: ${{ matrix.sdk_url }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT_DIR: ${{ github.workspace }}/dist/${{ matrix.name }}
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}/*
          if-no-files-found: error

  publish-snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Prepare snapshot assets
        run: |
          set -euo pipefail
          mkdir snapshot-assets
          for directory in downloaded/openwrt-*; do
            target="$(basename "$directory")"
            package="$(find "$directory" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) | head -n 1)"
            test -n "$package"
            output="snapshot-assets/${target}-$(basename "$package")"
            cp "$package" "$output"
            (
              cd snapshot-assets
              sha256sum "$(basename "$output")" >"${target}-sha256sums.txt"
            )
          done
          find snapshot-assets -maxdepth 1 -type f -print
      - name: Replace snapshot prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create snapshot snapshot-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title 'Development snapshot' \
            --notes "Automated build of main at ${GITHUB_SHA}. This snapshot may be replaced at any time."
